<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin login &middot; ibrahimaher.com</title>
<link rel="stylesheet" href="/styles.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card {
    width: 100%; max-width: 340px; padding: 2rem; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
  }
  .login-card h1 { font-family: var(--font-display); font-size: 1.3rem; margin: 0 0 1.2rem; }
  .login-card input {
    width: 100%; padding: 0.7rem 0.9rem; margin-bottom: 0.9rem; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--ink);
    font-family: var(--font-body); font-size: 0.95rem; box-sizing: border-box;
  }
  .login-card button {
    width: 100%; padding: 0.7rem; border-radius: 10px; border: none; cursor: pointer;
    background: var(--accent); color: #fff8f5; font-weight: 700; font-size: 0.95rem;
  }
  .login-error { color: #e5484d; font-size: 0.85rem; margin: -0.4rem 0 0.9rem; min-height: 1.1em; }
</style>
</head>
<body>
  <form class="login-card" id="login-form">
    <h1>Admin login</h1>
    <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
    <p class="login-error" id="login-error"></p>
    <button type="submit">Sign in</button>
  </form>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('login-error');
      errorEl.textContent = '';
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          window.location.href = '/admin/';
        } else {
          errorEl.textContent = data.error || 'Login failed.';
        }
      } catch {
        errorEl.textContent = 'Network error. Try again.';
      }
    });
  </script>
</body>
</html>
